<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="fv-silver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8edf5"/>
      <stop offset="100%" stop-color="#8898b0"/>
    </linearGradient>
    <linearGradient id="fv-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4a84b"/>
      <stop offset="100%" stop-color="#9a6e08"/>
    </linearGradient>
    <linearGradient id="fv-navy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#0f1a2e"/>
    </linearGradient>
    <!-- Background circle -->
    <linearGradient id="fv-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f1a2e"/>
      <stop offset="100%" stop-color="#1e3a5f"/>
    </linearGradient>
  </defs>
  <!-- Dark rounded square background -->
  <rect width="32" height="32" rx="7" fill="url(#fv-bg)"/>
  <!-- Left mountain -->
  <polygon points="2,26 9,6 17,26" fill="url(#fv-silver)"/>
  <!-- Right mountain (slightly offset, taller) -->
  <polygon points="10,26 17,3 24,26" fill="url(#fv-silver)" opacity="0.8"/>
  <!-- Snow cap on right peak -->
  <polygon points="17,3 14.5,10 19.5,10" fill="white" opacity="0.95"/>
  <!-- Gold wave -->
  <path d="M2,28.5 Q9,22 17,25.5 Q23,28 30,22" stroke="url(#fv-gold)" stroke-width="2.2" fill="none" stroke-linecap="round"/>
  <!-- Navy wave -->
  <path d="M2,30.5 Q10,25 18,27.5 Q24,30 30,24.5" stroke="url(#fv-navy)" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.6"/>
</svg>
